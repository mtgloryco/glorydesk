name: Build and Release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to build (e.g. 1.2.0)'
                required: false
                default: '1.2.0'

permissions:
    contents: write

jobs:
    build-windows:
        name: Build Windows
        runs-on: windows-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Install Velopack Tool
              run: dotnet tool install -g vpk

            - name: Get Version (Strip v)
              id: version
              shell: pwsh
              run: |
                  $tag = "${{ github.event.inputs.version }}"
                  if (-not $tag) {
                      $tag = "${{ github.event.release.tag_name }}"
                  }
                  if (-not $tag) {
                      $tag = "1.2.0"
                  }
                  $version = $tag.TrimStart('v')
                  if ($version -match '^(\d+\.\d+\.\d+)') {
                      $version = $Matches[1]
                  } else {
                      Write-Error "Release tag must be SemVer2 (e.g. v1.0.0), got: $tag"
                      exit 1
                  }
                  echo "VERSION=$version" >> $env:GITHUB_ENV
                  Write-Host "Building version: $version"

            - name: Publish App
              run: dotnet publish InventoryManagementSystem.Desktop/InventoryManagementSystem.Desktop.csproj -c Release -r win-x64 --self-contained true -o ./publish

            - name: Pack Release (Velopack)
              run: vpk pack -u "InventoryManagementSystem" -v "${{ env.VERSION }}" -p ./publish -e "GloryDesk.exe" --packTitle "Glory Desk" --packAuthors "MT GLORY CO"

            - name: Install Inno Setup
              run: choco install innosetup -y

            - name: Build Inno Installer (real Windows setup)
              shell: pwsh
              run: |
                  $payload = "${{ github.workspace }}\win-payload"
                  # Self-contained + ReadyToRun so customers don't need .NET installed.
                  dotnet publish InventoryManagementSystem.Desktop/InventoryManagementSystem.Desktop.csproj `
                      -c Release -r win-x64 --self-contained true `
                      -p:PublishSingleFile=false -p:PublishReadyToRun=true `
                      -o $payload
                  if ($LASTEXITCODE -ne 0) { Write-Error "Publish for installer failed"; exit 1 }
                  if (-not (Test-Path "$payload\GloryDesk.exe")) {
                    Write-Error "Expected $payload\GloryDesk.exe was not produced"; exit 1
                  }

                  $redist = "${{ github.workspace }}\InventoryManagementSystem.Shared\redist"
                  New-Item -ItemType Directory -Force -Path $redist | Out-Null
                  $redistExe = Join-Path $redist "vc_redist.x64.exe"
                  if (-not (Test-Path $redistExe)) {
                    Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $redistExe
                  }

                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  & $iscc "/DMyAppVersion=$env:VERSION" "/DPayloadDir=$payload" "/DRedistDir=$redist" `
                      "/O${{ github.workspace }}\Releases" `
                      "InventoryManagementSystem.Shared\GloryDesk_Setup_Script.iss"
                  if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed"; exit 1 }
                  Write-Host "Installer built: Releases\GloryDesk_Setup_v${env:VERSION}_Windows.exe"

            - name: Upload Release Assets
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.event.release.tag_name || format('v{0}', env.VERSION) }}
                  files: Releases/*
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Notify website download page
              if: success()
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WEBHOOK_URL: ${{ secrets.GLORYDESK_RELEASE_WEBHOOK_URL }}
                  WEBHOOK_SECRET: ${{ secrets.GLORYDESK_RELEASE_WEBHOOK_SECRET }}
              run: |
                  if (-not $env:WEBHOOK_URL -or -not $env:WEBHOOK_SECRET) {
                    Write-Host "Skipping website notify — set secrets GLORYDESK_RELEASE_WEBHOOK_URL and GLORYDESK_RELEASE_WEBHOOK_SECRET"
                    exit 0
                  }

                  $tag = "${{ github.event.release.tag_name }}"
                  if (-not $tag) {
                    $tag = "v$env:VERSION"
                  }
                  $version = $env:VERSION
                  $repo = "${{ github.repository }}"

                  # Prefer the Inno "real installer" (GloryDesk_Setup_*.exe); fall back to any Setup exe.
                  $assetsJson = gh api "repos/$repo/releases/tags/$tag" --jq ".assets"
                  $assets = $assetsJson | ConvertFrom-Json
                  $setup = $assets | Where-Object { $_.name -match '^GloryDesk_Setup.*\.exe$' } | Select-Object -First 1
                  if (-not $setup) {
                    $setup = $assets | Where-Object { $_.name -match '\.exe$' -and $_.name -match 'Setup|setup|Install' } | Select-Object -First 1
                  }
                  if (-not $setup) {
                    $setup = $assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
                  }
                  if (-not $setup) {
                    Write-Error "No .exe asset found on release $tag — website not updated"
                    exit 1
                  }

                  $payload = @{
                    platform    = "Windows"
                    version     = $version
                    tag         = $tag
                    fileName    = $setup.name
                    downloadUrl = $setup.browser_download_url
                    sizeBytes   = [int64]$setup.size
                    publishedAt = (Get-Date).ToUniversalTime().ToString("o")
                  } | ConvertTo-Json -Compress

                  Write-Host "Notifying website: $($setup.name) ($version)"
                  $headers = @{
                    Authorization  = "Bearer $($env:WEBHOOK_SECRET)"
                    "Content-Type" = "application/json"
                  }
                  $res = Invoke-RestMethod -Method Post -Uri $env:WEBHOOK_URL -Headers $headers -Body $payload
                  Write-Host ($res | ConvertTo-Json -Compress)

    build-linux:
        name: Build Linux
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Install Velopack Tool
              run: dotnet tool install -g vpk

            - name: Get Version (Strip v)
              id: version
              run: |
                  TAG="${{ github.event.inputs.version }}"
                  if [ -z "$TAG" ]; then
                      TAG="${{ github.event.release.tag_name }}"
                  fi
                  if [ -z "$TAG" ]; then
                      TAG="1.2.0"
                  fi
                  VERSION="${TAG#v}"
                  if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
                      VERSION="${BASH_REMATCH[1]}"
                  else
                      echo "Release tag must be SemVer2 (e.g. v1.2.0), got: $TAG"
                      exit 1
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "Building version: $VERSION"

            - name: Publish App
              run: dotnet publish InventoryManagementSystem.Desktop/InventoryManagementSystem.Desktop.csproj -c Release -r linux-x64 --self-contained true -o ./publish

            - name: Pack Release (Velopack)
              run: vpk pack -u "InventoryManagementSystem" -v "${{ env.VERSION }}" -p ./publish -e "GloryDesk" --packTitle "Glory Desk" --packAuthors "MT GLORY CO"

            - name: Upload Release Assets
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.event.release.tag_name || format('v{0}', env.VERSION) }}
                  files: Releases/*
                  token: ${{ secrets.GITHUB_TOKEN }}
