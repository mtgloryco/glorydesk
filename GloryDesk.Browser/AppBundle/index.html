<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GloryDesk - Cloud Business Management</title>
    <link rel="icon" type="image/x-icon" href="glorydesk.ico" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        #out {
            width: 100%;
            height: 100%;
        }
        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-in-out;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .splash-logo {
            width: 230px;
            height: auto;
            margin-bottom: 28px;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.4));
        }
        .progress-container {
            width: 320px;
            max-width: 85vw;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .progress-bar-fill {
            height: 100%;
            width: 5%;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8, #818cf8);
            border-radius: 9999px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .loading-phrase {
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: opacity 0.2s ease-in-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }
        .progress-percent {
            color: #38bdf8;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="splash">
        <img class="splash-logo" src="glorydesk-logo-white.png" alt="GloryDesk" onerror="this.onerror=null;this.src='glorydesk-logo.png';" />
        
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
            <div class="progress-info">
                <span id="loading-phrase" class="loading-phrase">Preparing your workspace...</span>
                <span id="progress-percent" class="progress-percent">0%</span>
            </div>
        </div>
    </div>
    
    <div id="out"></div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
