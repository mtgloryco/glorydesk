<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GloryDesk - Cloud Business Management</title>
    <link rel="icon" type="image/x-icon" href="glorydesk.ico" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        #out {
            width: 100%;
            height: 100%;
        }
        /* Simple stylish splash screen while loading */
        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            z-index: 1000;
            transition: opacity 0.5s ease-in-out;
            background-color: #0f172a;
        }
        .splash-logo {
            width: 220px;
            height: auto;
            margin-bottom: 24px;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        .loading-text {
            font-size: 15px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="splash">
        <img class="splash-logo" src="glorydesk-logo-white.png" alt="GloryDesk" onerror="this.onerror=null;this.src='glorydesk-logo.png';" />
        <div class="spinner"></div>
        <div class="loading-text">Loading GloryDesk...</div>
    </div>
    
    <div id="out"></div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
